:145},color:{name:"Медь",h:18,s:68,l:42},symmetry:.12,smooth:.08,pass:.58,reward:360,brief:"Медный боб! Сначала покрасьте волосы в медь, потом ровное каре до подбородка. Краску купите в магазине.",client:mt("София",29,"tan","#4a3320",lo,{smile:.55,lip:1.1,earrings:!0}),tips:["Сначала цвет, потом форма — так пигмент ляжет ровно.","Купите краску «Медь» в магазине салона.","Прокрашивайте пряди у корней и по длине."]},{id:6,title:"Боб с прямой чёлкой",family:"Каре",difficulty:3,time:80,startLength:325,targets:{top:152,side:138,back:148,bangs:62,nape:140},symmetry:.16,smooth:.1,pass:.58,reward:330,brief:"Боб с прямой тяжёлой чёлкой. Срез должен быть идеально ровным, чёлка — до бровей.",client:mt("Ирина",36,"light","#7d8f9c",O0,{smile:.4,jaw:1.03}),tips:["Прямая чёлка требует самой короткой длины в передней зоне.","Срез делайте мелкими шагами.","Не оставляйте длинных прядей у висков."]},{id:7,title:"Блонд-каскад",family:"Окрашивание",difficulty:4,time:105,startLength:370,targets:{top:285,side:262,back:295,bangs:145,nape:250},color:{name:"Блонд",h:42,s:62,l:68},lighten:!0,symmetry:.1,smooth:.12,pass:.6,reward:420,brief:"Хочу блонд и длинный каскад. Волосы тёмные — сначала осветлите, потом тонируйте в блонд.",client:mt("Ксения",25,"warm","#4f7a5e",Pn,{smile:.7,freckles:.35}),tips:["Осветлитель поднимает тон на несколько уровней.","Без осветления блонд не возьмётся на тёмные волосы.","Сначала цвет, затем длина."]},{id:8,title:"Лесенка",family:"Слоистые",difficulty:3,time:95,startLength:365,targets:{top:275,side:255,back:285,bangs:150,nape:245},symmetry:.1,smooth:.14,pass:.57,reward:340,brief:"Лесенка на длинные волосы, мягкие слои, без чёлки. Концы должны лежать ровно.",client:mt("Ольга",45,"olive","#5f7a4a",to,{smile:.45,earrings:!0,jaw:1.02}),tips:["Лесенка — плавный переход длины, а не ступеньки.","Верхний слой короче нижнего.","Чёлку не трогайте: её в стрижке нет."]},{id:9,title:"Розовое пикси",family:"Окрашивание",difficulty:4,time:95,startLength:320,targets:{top:98,sid
